version: "3.9"

services:
  # ---- Go API backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8080
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - db
    restart: unless-stopped

  # ---- Next.js dashboard ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    restart: unless-stopped

  # ---- Rust log agent ----
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      - LOGREEF_API_KEY=${LOGREEF_API_KEY}
    command:
      - "--files=/var/log/app.log"
      - "--endpoint=http://backend:8080/api/v1/ingest"
      - "--service=demo"
      - "--host=docker-agent"
    volumes:
      - ./logs:/var/log:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ---- Local Postgres (for development only, production uses Supabase) ----
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=logreef
      - POSTGRES_PASSWORD=logreef_dev
      - POSTGRES_DB=logreef
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql

volumes:
  pgdata:
